name: Test kitchen command failure handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install failing test-kitchen stub
        run: |
          # Create a stub 'kitchen' command that exits with failure
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/kitchen" << 'EOF'
          #!/bin/bash
          echo "kitchen called with: $@"
          echo "Simulated kitchen failure"
          exit 1
          EOF
          chmod +x "$HOME/bin/kitchen"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          action: test
          os: ubuntu
          suite: failing
        continue-on-error: true

      - name: Assert action failed when kitchen exits non-zero
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action outcome to be 'failure', got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
