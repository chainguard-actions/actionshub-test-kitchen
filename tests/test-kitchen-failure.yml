name: Test kitchen failure propagation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock kitchen binary that fails
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/kitchen" << 'EOF'
          #!/bin/sh
          echo "kitchen called with args: $*"
          echo "Simulating kitchen failure"
          exit 1
          EOF
          chmod +x "$HOME/.local/bin/kitchen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          action: 'test'
          suite: 'default'
          os: 'ubuntu-2004'
        continue-on-error: true

      - name: Assert action failed when kitchen exits non-zero
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when kitchen returned non-zero"
          else
            echo "FAIL: expected action to fail but got outcome: $OUTCOME"
            exit 1
          fi
