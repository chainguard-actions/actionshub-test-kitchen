name: Test custom kitchen action (verify)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake kitchen binary
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/kitchen" << 'EOF'
          #!/bin/sh
          echo "kitchen called with args: $@"
          echo "$@" > /tmp/kitchen-args.txt
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/kitchen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          action: verify
          os: centos
          suite: myapp

      - name: Assert kitchen was called with verify action and correct suite-os
        run: |
          ARGS=$(cat /tmp/kitchen-args.txt)
          echo "kitchen args: $ARGS"
          if [ "$ARGS" != "verify myapp-centos" ]; then
            echo "FAIL: expected 'verify myapp-centos' but got '$ARGS'"
            exit 1
          fi
          echo "PASS"
