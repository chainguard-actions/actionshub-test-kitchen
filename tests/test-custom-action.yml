name: Test custom action (converge)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install test-kitchen stub
        run: |
          # Create a stub 'kitchen' command that records what it was called with
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/kitchen" << 'EOF'
          #!/bin/bash
          echo "kitchen called with: $@"
          echo "KITCHEN_ARGS=$@" >> "$GITHUB_ENV"
          exit 0
          EOF
          chmod +x "$HOME/bin/kitchen"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          action: converge
          os: centos
          suite: myapp

      - name: Assert kitchen was called with converge and correct suite name
        run: |
          echo "KITCHEN_ARGS: $KITCHEN_ARGS"
          if [ "$KITCHEN_ARGS" != "converge myapp-centos" ]; then
            echo "FAIL: expected 'converge myapp-centos', got '$KITCHEN_ARGS'"
            exit 1
          fi
          echo "PASS"
